name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # the tests also fail when styles/ does not match the sources (npm run build:styles)
      - run: npm test
        working-directory: app
      - name: Package contents
        if: matrix.node == 22
        run: npm pack --dry-run
